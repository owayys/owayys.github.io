name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  repository_dispatch:
    types: [submodule_push]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
          submodules: true
          ref: ${{ github.ref }}
          token: ${{ secrets.NEXUS_PAT }}
      - name: Update submodules to latest commit
        run: |
          git submodule update --init --recursive
          git submodule foreach '
            git checkout main || exit 0;
            git pull origin $(git rev-parse --abbrev-ref HEAD)
          '
        env:
          GITHUB_TOKEN: ${{ secrets.NEXUS_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/*/package-lock.json
      - name: Install Dependencies
        run: npm ci
      # local plugins are linked, not built, by Quartz
      - name: Build local plugins
        run: |
          for dir in plugins/*/; do
            echo "::group::$dir"
            (cd "$dir" && npm ci && npm run build) || exit 1
            echo "::endgroup::"
          done
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Build Quartz
        run: npx quartz build -d nexus
      # a plugin that fails to load only logs an error, so check the tracker filter ran
      - name: Check tracker notes are unpublished
        run: |
          if [ -e public/trackers ]; then
            echo "::error::trackers/ was published; the tracker plugin likely failed to load"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
